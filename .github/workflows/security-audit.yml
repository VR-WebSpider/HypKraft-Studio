name: Security Audit & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Secret Leak Prevention Scan
        shell: bash
        run: |
          echo "Scanning codebase for inadvertent hardcoded credentials..."
          ! grep -rE "(AIza[0-9A-Za-z-_]{35}|sk-[a-zA-Z0-9]{20,}|ghp_[0-9a-zA-Z]{36})" --exclude-dir={node_modules,.git,dist} .
          echo "Secret scan passed cleanly!"

      - name: Verify Frontend Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Landing & Portal Build
        working-directory: hypkraft-upcoming
        run: |
          npm ci
          npm run build
